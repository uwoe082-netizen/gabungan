<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAI Psikotes Simulator — Latihan Tes BUMN</title>
<meta name="description" content="Simulator psikotes rekrutmen BUMN dengan lima modul: Kraepelin, TPA, logika spasial, daya ingat, dan inventori kepribadian. Soal dibangkitkan ulang setiap percobaan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="../shared/storage-bridge.js" onerror="console.warn('shared module tidak tersedia (mode standalone)')"></script>
<script src="../shared/gamification-core.js" onerror="console.warn('shared module tidak tersedia (mode standalone)')"></script>
<style>
  :root{
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
  }
  html[data-mode="dark"]{
    --kai-bg:#0b0f14; --kai-panel:#121820; --kai-line:#24303d;
    --kai-text:#e6edf3; --kai-dim:#7c8b9b; --kai-signal:#f2b23c; --kai-alert:#e05c4b;
  }
  html[data-mode="light"]{
    --kai-bg:#f4f5f2; --kai-panel:#ffffff; --kai-line:#d3d8dd;
    --kai-text:#16202a; --kai-dim:#6a7885; --kai-signal:#b6761a; --kai-alert:#b23a2c;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--kai-bg); color:var(--kai-text); font-family:var(--font-mono); }
  button, input{ font-family:var(--font-mono); }
  a{ color:inherit; }

  .wrap{ max-width:1120px; margin:0 auto; padding:0 16px; }
  @media (min-width:640px){ .wrap{ padding:0 24px; } }

  header{ position:sticky; top:0; z-index:10; border-bottom:1px solid var(--kai-line); background:color-mix(in oklab, var(--kai-bg) 95%, transparent); backdrop-filter:blur(6px); }
  header .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; }
  @media (min-width:640px){ header .row{ padding:12px 24px; } }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:32px; height:32px; display:grid; place-items:center; border:1px solid var(--kai-signal); color:var(--kai-signal); font-size:12px; }
  .brand-title{ font-size:12px; text-transform:uppercase; letter-spacing:0.22em; margin:0; }
  .brand-sub{ font-size:10px; text-transform:uppercase; letter-spacing:0.2em; color:var(--kai-dim); margin:2px 0 0; }
  .head-actions{ display:flex; align-items:center; gap:8px; }
  @media (min-width:640px){ .head-actions{ gap:12px; } }
  .clock{ font-size:14px; color:var(--kai-signal); font-variant-numeric:tabular-nums; }
  .ghost-btn{ border:1px solid var(--kai-line); background:transparent; color:var(--kai-dim); padding:6px 10px; font-size:10px; text-transform:uppercase; letter-spacing:0.18em; cursor:pointer; transition:color .15s ease, border-color .15s ease; }
  .ghost-btn:hover{ border-color:var(--kai-signal); color:var(--kai-signal); }
  .ghost-btn.text{ color:var(--kai-text); text-decoration:none; display:inline-block; }

  main{ padding:24px 16px 32px; }
  @media (min-width:640px){ main{ padding:32px 24px 40px; } }
  .maxw{ max-width:1120px; margin:0 auto; }

  .hero{ position:relative; overflow:hidden; border:1px solid var(--kai-line); padding:24px; background-image:
      linear-gradient(to right, color-mix(in srgb, var(--kai-line) 55%, transparent) 1px, transparent 1px),
      linear-gradient(to bottom, color-mix(in srgb, var(--kai-line) 55%, transparent) 1px, transparent 1px);
    background-size:44px 44px; }
  @media (min-width:640px){ .hero{ padding:32px; } }
  .hero h1{ max-width:26ch; font-size:22px; text-transform:uppercase; line-height:1.3; letter-spacing:0.06em; margin:0; }
  @media (min-width:640px){ .hero h1{ font-size:28px; } }
  .hero p{ margin:12px 0 0; max-width:52ch; font-size:13px; line-height:1.6; color:var(--kai-dim); }
  .hero .actions{ margin-top:20px; display:flex; flex-wrap:wrap; gap:8px; }

  .kai-btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:3px; padding:10px 16px; font-size:11px; text-transform:uppercase; letter-spacing:0.18em; border:none; cursor:pointer; transition:filter .15s ease, color .15s ease, border-color .15s ease; }
  .kai-btn.solid{ background:var(--kai-signal); color:var(--kai-bg); }
  .kai-btn.solid:hover{ filter:brightness(1.1); }
  .kai-btn.ghost{ background:transparent; border:1px solid var(--kai-line); color:var(--kai-text); }
  .kai-btn.ghost:hover{ border-color:var(--kai-signal); color:var(--kai-signal); }
  .kai-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .section-label{ margin:32px 0 12px; font-size:10px; text-transform:uppercase; letter-spacing:0.28em; color:var(--kai-dim); }
  .mod-grid{ display:grid; gap:12px; grid-template-columns:1fr; }
  @media (min-width:640px){ .mod-grid{ grid-template-columns:1fr 1fr; } }
  .mod-card{ text-align:left; border:1px solid var(--kai-line); background:var(--kai-panel); padding:20px; cursor:pointer; transition:border-color .15s ease; color:var(--kai-text); }
  .mod-card:hover{ border-color:var(--kai-signal); }
  .mod-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .mod-kind{ font-size:10px; text-transform:uppercase; letter-spacing:0.22em; color:var(--kai-dim); }
  .mod-name{ margin:4px 0 0; font-size:17px; text-transform:uppercase; letter-spacing:0.03em; }
  .mod-card:hover .mod-name{ color:var(--kai-signal); }
  .mod-dur{ flex-shrink:0; border:1px solid var(--kai-line); padding:3px 7px; font-size:10px; color:var(--kai-dim); }
  .mod-desc{ margin:10px 0 0; font-size:12.5px; line-height:1.6; color:var(--kai-dim); }
  .mod-foot{ margin-top:14px; border-top:1px solid var(--kai-line); padding-top:10px; display:flex; align-items:center; justify-content:space-between; font-size:11px; }
  .mod-foot .last{ color:var(--kai-dim); }
  .mod-foot .last b{ color:var(--kai-text); font-weight:500; }
  .mod-foot .go{ color:var(--kai-signal); }

  .panel{ border:1px solid var(--kai-line); background:var(--kai-panel); border-radius:4px; }
  .panel-label{ border-bottom:1px solid var(--kai-line); padding:8px 16px; font-size:10px; text-transform:uppercase; letter-spacing:0.28em; color:var(--kai-dim); }
  .progress-line{ height:4px; width:100%; overflow:hidden; background:var(--kai-line); }
  .progress-fill{ height:100%; background:var(--kai-signal); transition:width .3s ease; }
  .stack{ display:flex; flex-direction:column; gap:16px; }

  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .stat{ border:1px solid var(--kai-line); background:color-mix(in oklab, var(--kai-bg) 40%, transparent); padding:8px 12px; }
  .stat .l{ font-size:10px; text-transform:uppercase; letter-spacing:0.2em; color:var(--kai-dim); margin:0; }
  .stat .v{ margin:4px 0 0; font-size:20px; font-variant-numeric:tabular-nums; }

  /* Kraepelin */
  .kr-grid{ display:grid; gap:16px; grid-template-columns:1fr; }
  @media (min-width:1024px){ .kr-grid{ grid-template-columns:1fr minmax(0,300px); } }
  .kr-column-wrap{ position:relative; display:flex; height:300px; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px; overflow:hidden; padding:20px 0; }
  @media (min-width:640px){ .kr-column-wrap{ height:360px; } }
  .kr-highlight{ position:absolute; left:50%; top:26px; height:86px; width:96px; transform:translateX(-50%); border-radius:3px; border:1px solid var(--kai-line); transition:border-color .1s ease, background .1s ease; }
  .kr-highlight.ok{ border-color:var(--kai-signal); background:color-mix(in oklab, var(--kai-signal) 15%, transparent); }
  .kr-highlight.no{ border-color:var(--kai-alert); background:color-mix(in oklab, var(--kai-alert) 15%, transparent); }
  .kr-digit{ position:relative; font-size:30px; font-variant-numeric:tabular-nums; }
  @media (min-width:640px){ .kr-digit{ font-size:36px; } }
  .kr-digit.dim{ color:color-mix(in oklab, var(--kai-dim) 60%, transparent); }
  .kr-keypad{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; padding:12px; }
  .kr-key{ aspect-ratio:1; border-radius:3px; border:1px solid var(--kai-line); background:color-mix(in oklab, var(--kai-bg) 50%, transparent); color:var(--kai-text); font-size:16px; cursor:pointer; }
  .kr-key:hover{ border-color:var(--kai-signal); color:var(--kai-signal); }
  .kr-key:active{ background:var(--kai-signal); color:var(--kai-bg); }

  /* MCQ */
  .q-prompt{ padding:20px 16px; font-size:16px; line-height:1.6; }
  @media (min-width:640px){ .q-prompt{ font-size:18px; padding:24px 16px; } }
  .choice-grid{ display:grid; gap:8px; grid-template-columns:1fr; }
  @media (min-width:640px){ .choice-grid{ grid-template-columns:1fr 1fr; } }
  .choice-btn{ text-align:left; border-radius:3px; border:1px solid var(--kai-line); background:var(--kai-panel); color:var(--kai-text); padding:14px 16px; font-size:15px; cursor:pointer; font-family:var(--font-mono); }
  .choice-btn:hover{ border-color:var(--kai-signal); }
  .choice-btn .idx{ margin-right:10px; font-size:11px; color:var(--kai-dim); }
  .choice-btn.right{ border-color:var(--kai-signal); background:color-mix(in oklab, var(--kai-signal) 15%, transparent); color:var(--kai-signal); }
  .choice-btn.wrong{ border-color:var(--kai-alert); background:color-mix(in oklab, var(--kai-alert) 15%, transparent); color:var(--kai-alert); }
  .choice-btn:disabled{ cursor:default; }

  /* Spatial */
  .sp-grid{ display:grid; gap:16px; grid-template-columns:1fr; }
  @media (min-width:768px){ .sp-grid{ grid-template-columns:220px 1fr; } }
  .sp-base{ display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px; }
  .sp-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.16em; color:var(--kai-signal); }
  .sp-opts{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:12px; }
  @media (min-width:640px){ .sp-opts{ grid-template-columns:repeat(4,1fr); } }
  .sp-opt{ display:flex; flex-direction:column; align-items:center; gap:8px; border-radius:3px; border:1px solid var(--kai-line); padding:8px; cursor:pointer; background:transparent; }
  .sp-opt:hover{ border-color:var(--kai-signal); }
  .sp-opt.right{ border-color:var(--kai-signal); background:color-mix(in oklab, var(--kai-signal) 10%, transparent); }
  .sp-opt.wrong{ border-color:var(--kai-alert); background:color-mix(in oklab, var(--kai-alert) 10%, transparent); }
  .sp-opt .lab{ font-size:11px; color:var(--kai-dim); }
  canvas{ display:block; }

  /* Memory */
  table.manifest{ width:100%; border-collapse:collapse; font-size:14px; }
  table.manifest th{ text-align:left; padding:8px 16px; font-size:10px; text-transform:uppercase; letter-spacing:0.2em; color:var(--kai-dim); }
  table.manifest td{ padding:10px 16px; border-top:1px solid var(--kai-line); }
  table.manifest td.kode{ color:var(--kai-signal); }

  /* Personality */
  .ip-grid{ display:grid; gap:12px; grid-template-columns:1fr; }
  @media (min-width:640px){ .ip-grid{ grid-template-columns:1fr 1fr; } }
  .ip-card{ text-align:left; border-radius:3px; border:1px solid var(--kai-line); background:var(--kai-panel); color:var(--kai-text); padding:20px; cursor:pointer; font-family:var(--font-mono); }
  .ip-card:hover{ border-color:var(--kai-signal); }
  .ip-card .tag{ font-size:10px; text-transform:uppercase; letter-spacing:0.22em; color:var(--kai-dim); }
  .ip-card p{ margin:12px 0 0; font-size:14px; line-height:1.6; }
  .ip-card:hover p{ color:var(--kai-signal); }

  /* Result */
  .result-score{ text-align:center; padding:26px 20px; }
  .result-score .l{ font-size:10px; text-transform:uppercase; letter-spacing:0.28em; color:var(--kai-dim); margin:0; }
  .result-score .v{ margin:8px 0 0; font-size:44px; color:var(--kai-signal); font-variant-numeric:tabular-nums; }
  .result-score .v span{ color:var(--kai-dim); }
  .radar-wrap{ padding:20px; }

  footer{ border-top:1px solid var(--kai-line); padding:18px 16px; text-align:center; font-size:10px; text-transform:uppercase; letter-spacing:0.24em; color:var(--kai-dim); }

  @media (prefers-reduced-motion:reduce){ * { transition:none !important; } }
</style>
</head>
<body>

<header>
  <div class="row">
    <div class="brand">
      <div class="brand-mark">KAI</div>
      <div>
        <p class="brand-title">Psikotes Simulator</p>
        <p class="brand-sub">Unit latihan rekrutmen</p>
      </div>
    </div>
    <div class="head-actions">
      <span class="clock" id="liveClock">00:00:00</span>
      <button class="ghost-btn" id="modeToggleBtn">Terang</button>
      <a class="ghost-btn text" id="backLink" href="../">← Arsip</a>
    </div>
  </div>
</header>

<main>
  <div class="maxw" id="app"></div>
</main>

<footer>Arsip · Panel kognitif</footer>

<script>
(function () {
  "use strict";

  /* ============================= Util & generator soal ============================= */
  const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const pick = (arr) => arr[randInt(0, arr.length - 1)];
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = randInt(0, i);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const uid = () => Math.random().toString(36).slice(2, 10);

  function buildChoices(answer, spread) {
    spread = spread || 6;
    const set = new Set([answer]);
    while (set.size < 4) {
      const delta = randInt(1, spread) * (Math.random() < 0.5 ? -1 : 1);
      const candidate = answer + delta;
      if (candidate >= 0) set.add(candidate);
    }
    return shuffle([...set]).map((v) => ({ label: String(v), correct: v === answer }));
  }

  function generateSeries() {
    const kind = randInt(1, 4);
    let seq = [];
    let answer = 0;
    if (kind === 1) {
      const start = randInt(2, 12), d = randInt(2, 6), step = randInt(1, 4);
      let cur = start, diff = d;
      for (let i = 0; i < 5; i++) { seq.push(cur); cur += diff; diff += step; }
      answer = cur;
    } else if (kind === 2) {
      const a = randInt(3, 15), b = randInt(20, 40), da = randInt(2, 7), db = -randInt(2, 6);
      for (let i = 0; i < 3; i++) { seq.push(a + da * i, b + db * i); }
      answer = a + da * 3;
    } else if (kind === 3) {
      const start = randInt(2, 5), r = randInt(2, 3);
      let cur = start;
      for (let i = 0; i < 4; i++) { seq.push(cur); cur *= r; }
      answer = cur;
    } else {
      let a = randInt(1, 8), b = randInt(2, 11);
      seq = [a, b];
      for (let i = 0; i < 3; i++) { const c = a + b; seq.push(c); a = b; b = c; }
      answer = a + b;
    }
    return {
      id: uid(), prompt: seq.join(", ") + ", ...", hint: "Lanjutkan deret berikut",
      choices: buildChoices(answer, Math.max(4, Math.round(answer * 0.2) || 4))
    };
  }

  const NAMES = ["Rian", "Sinta", "Bagas", "Dewi", "Alif", "Nadia", "Fajar", "Ratih"];
  const CITIES = ["Bandung", "Semarang", "Surabaya", "Yogyakarta", "Cirebon", "Malang"];
  const GOODS = ["tiket", "koper", "paket", "kursi", "gerbong"];

  function generateStory() {
    const kind = randInt(1, 3);
    const a = pick(NAMES);
    let b = pick(NAMES);
    while (b === a) b = pick(NAMES);
    if (kind === 1) {
      const speed = randInt(40, 90), hours = randInt(2, 6), answer = speed * hours;
      return { id: uid(), prompt: `Kereta yang ditumpangi ${a} melaju rata-rata ${speed} km/jam menuju ${pick(CITIES)} selama ${hours} jam. Berapa km jarak yang ditempuh?`, hint: "Soal cerita", choices: buildChoices(answer, randInt(10, 40)) };
    }
    if (kind === 2) {
      const perOrang = randInt(3, 9), orang = randInt(4, 12), answer = perOrang * orang;
      return { id: uid(), prompt: `${a} dan ${orang - 1} rekannya masing-masing membawa ${perOrang} ${pick(GOODS)}. Berapa total yang dibawa seluruh rombongan?`, hint: "Soal cerita", choices: buildChoices(answer, randInt(4, 15)) };
    }
    const umurB = randInt(8, 24), beda = randInt(3, 12), tahun = randInt(2, 8), answer = umurB + beda + tahun;
    return { id: uid(), prompt: `Usia ${b} sekarang ${umurB} tahun. ${a} ${beda} tahun lebih tua darinya. Berapa usia ${a} ${tahun} tahun dari sekarang?`, hint: "Soal cerita", choices: buildChoices(answer, randInt(3, 9)) };
  }

  const generateTpaSet = (n) => Array.from({ length: n || 10 }, (_, i) => (i % 2 === 0 ? generateSeries() : generateStory()));

  function applyTransform(shape, t) {
    return { points: shape.points.map(([x, y]) => {
      const px = t.flip ? -x : x, py = y;
      const rad = (t.rotate * Math.PI) / 180;
      const cos = Math.round(Math.cos(rad)), sin = Math.round(Math.sin(rad));
      return [px * cos - py * sin, px * sin + py * cos];
    }) };
  }
  function randomShape() {
    const n = randInt(4, 6);
    const pts = [];
    for (let i = 0; i < n; i++) {
      const angle = (i / n) * Math.PI * 2 + Math.random() * 0.35;
      const r = randInt(30, 62);
      pts.push([Math.round(Math.cos(angle) * r), Math.round(Math.sin(angle) * r)]);
    }
    pts.push([randInt(10, 40), randInt(-70, -40)]);
    return { points: pts };
  }
  const shapeKey = (s) => s.points.map((p) => p.join(":")).join("|");

  function generateSpatialQuestion() {
    const base = randomShape();
    const transform = { rotate: pick([90, 180, 270]), flip: Math.random() < 0.5 };
    const correct = applyTransform(base, transform);
    const distractors = [];
    const used = new Set([shapeKey(correct)]);
    const variants = shuffle([
      { rotate: 90, flip: !transform.flip }, { rotate: 180, flip: !transform.flip },
      { rotate: 270, flip: transform.flip }, { rotate: 0, flip: !transform.flip },
      { rotate: 180, flip: transform.flip }
    ]);
    for (const v of variants) {
      if (distractors.length === 3) break;
      const s = applyTransform(base, v);
      if (!used.has(shapeKey(s))) { used.add(shapeKey(s)); distractors.push(s); }
    }
    const options = shuffle([correct, ...distractors]);
    return {
      id: uid(), base, transform, options,
      answerIndex: options.findIndex((o) => shapeKey(o) === shapeKey(correct)),
      label: `Rotasi ${transform.rotate}°${transform.flip ? " + refleksi cermin" : ""}`
    };
  }

  function generateMemoryRows(n) {
    n = n || 10;
    const prefixes = ["KA", "AR", "BM", "TG", "SN"];
    const rows = [];
    const seen = new Set();
    while (rows.length < n) {
      const kode = `${pick(prefixes)}-${randInt(100, 999)}`;
      if (seen.has(kode)) continue;
      seen.add(kode);
      rows.push({ kode, kursi: `${randInt(1, 12)}${pick(["A", "B", "C", "D", "E"])}`, nama: pick(NAMES) });
    }
    return rows;
  }
  function generateMemoryQuiz(rows, n) {
    n = n || 6;
    const picked = shuffle(rows).slice(0, n);
    return picked.map((row) => {
      const askKursi = Math.random() < 0.5;
      const answer = askKursi ? row.kursi : row.nama;
      const pool = rows.filter((r) => (askKursi ? r.kursi !== row.kursi : r.nama !== row.nama)).map((r) => (askKursi ? r.kursi : r.nama));
      const options = new Set([answer]);
      for (const p of shuffle(pool)) { if (options.size === 4) break; options.add(p); }
      while (options.size < 4) options.add(askKursi ? `${randInt(1, 12)}${pick(["A", "B", "C"])}` : pick(NAMES));
      return {
        id: uid(),
        prompt: askKursi ? `Nomor kursi untuk kereta ${row.kode}?` : `Siapa penumpang pada kereta ${row.kode}?`,
        hint: "Daya ingat",
        choices: shuffle([...options]).map((label) => ({ label, correct: label === answer }))
      };
    });
  }

  const PERSONALITY_DIMENSIONS = ["Ketelitian", "Kepemimpinan", "Kerja Sama", "Ketahanan Tekanan", "Inisiatif", "Kedisiplinan"];
  const STATEMENTS = {
    "Ketelitian": ["Saya memeriksa ulang pekerjaan sebelum menyerahkannya.", "Saya terganggu bila ada detail kecil yang tidak rapi.", "Saya membuat daftar periksa sebelum bertugas."],
    "Kepemimpinan": ["Saya terbiasa mengarahkan rekan saat situasi tidak jelas.", "Saya berani mengambil keputusan atas nama tim.", "Saya nyaman menjadi orang yang bicara di depan."],
    "Kerja Sama": ["Saya mendahulukan hasil tim di atas pengakuan pribadi.", "Saya mudah menyesuaikan cara kerja dengan rekan baru.", "Saya menawarkan bantuan sebelum diminta."],
    "Ketahanan Tekanan": ["Saya tetap tenang ketika jadwal berubah tiba-tiba.", "Saya bisa bekerja baik walau waktunya mendesak.", "Saya jarang terpancing saat ditegur keras."],
    "Inisiatif": ["Saya mencari pekerjaan tambahan saat tugas saya selesai.", "Saya mengusulkan perbaikan cara kerja yang lama.", "Saya mencoba solusi baru walau belum pasti berhasil."],

    for (let i = 0; i < n; i++) {
      const dims = shuffle(PERSONALITY_DIMENSIONS.slice());
      const dimA = dims[0], dimB = dims[1];
      pairs.push({ id: uid(), a: { text: pick(STATEMENTS[dimA]), dim: dimA }, b: { text: pick(STATEMENTS[dimB]), dim: dimB } });

    return pairs;
  }

  const KAI_LS_KEY = "kai:lastScores";
  const KAI_LS_HISTORY_KEY = "kai:history";
  function loadLastScores() { try { return JSON.parse(localStorage.getItem(KAI_LS_KEY)) || {}; } catch (e) { return {}; } }
  function saveLastScores() { try { localStorage.setItem(KAI_LS_KEY, JSON.stringify(lastScores)); } catch (e) {} }
  function appendLocalHistory(entry) {
    try {
      const hist = JSON.parse(localStorage.getItem(KAI_LS_HISTORY_KEY)) || [];
      hist.push(entry);
      if (hist.length > 200) hist.splice(0, hist.length - 200);
      localStorage.setItem(KAI_LS_HISTORY_KEY, JSON.stringify(hist));
    } catch (e) {}
  }

  /**
   * reportScore — sama persis kontraknya dengan versi sebelumnya:
   * detail (opsional): { correct, total, pct, extra } dipakai untuk riwayat,
   * bridge cross-app, dan XP global. Modul ipsatif (Kepribadian) tidak
   * mengirim detail (tidak ada benar/salah), jadi tidak memicu XP — sama
   * seperti perilaku sebelumnya.
   */
  function reportScore(id, label, detail) {
    lastScores[id] = label;
    saveLastScores();
    const entry = Object.assign({ module: id, label }, detail || {});
    appendLocalHistory(Object.assign({}, entry, { date: new Date().toISOString() }));
    if (typeof SharedStorage !== "undefined") SharedStorage.saveKaiPsikotesResult(entry);
    if (typeof SharedGamification !== "undefined" && detail && typeof detail.pct === "number") {
      const passed = detail.pct >= 80;
      SharedGamification.awardXP("kai", passed ? SharedGamification.XP_UNITS.kai_pass : Math.round(detail.pct / 4), id);
    }
  }

  function renderRadarSVG(data) {
    const size = 260, c = size / 2, r = size / 2 - 42, n = data.length;
    const point = (idx, value) => {
      const angle = (idx / n) * Math.PI * 2 - Math.PI / 2;
      const rad = (value / 100) * r;
      return [c + Math.cos(angle) * rad, c + Math.sin(angle) * rad];
    };
    const path = data.map((d, i) => point(i, Math.max(8, d.value)).join(",")).join(" ");
    const rings = [25, 50, 75, 100].map((ring) =>
      `<polygon points="${data.map((_, i) => point(i, ring).join(",")).join(" ")}" fill="none" stroke="var(--kai-line)"/>`
    ).join("");
    const spokes = data.map((_, i) => { const [x, y] = point(i, 100); return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--kai-line)"/>`; }).join("");
    const labels = data.map((d) => {
      const idx = data.indexOf(d);
      const [x, y] = point(idx, 118);
      return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="var(--kai-dim)" style="text-transform:uppercase;letter-spacing:0.08em">${d.dim}</text>`;
    }).join("");
    return `<svg viewBox="0 0 ${size} ${size}" style="display:block;margin:0 auto;height:auto;width:100%;max-width:320px">
      ${rings}${spokes}
      <polygon points="${path}" fill="var(--kai-signal)" fill-opacity="0.25" stroke="var(--kai-signal)" stroke-width="2"/>
      ${labels}
    </svg>`;
  }

            </div>
          </div>

          </div>
        </div>
      </div>`;

    const digitsEl = document.getElementById("krDigits");
    const highlightEl = document.getElementById("krHighlight");

    function renderDigits() {
      const view = digits.slice(cursor, cursor + 9);
      digitsEl.innerHTML = view.map((d, i) => `<span class="kr-digit ${i < 2 ? "" : "dim"}" style="opacity:${Math.max(0.25, 1 - i * 0.11)}">${d}</span>`).join("");
    }
    renderDigits();

    [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].forEach((n) => {
      const btn = document.createElement("button");
      btn.className = "kr-key";
      btn.textContent = n;
      btn.addEventListener("click", () => submit(n));
      document.getElementById("krKeypad").appendChild(btn);
    });

    function updateStats() {
      const answered = correct + wrong;
      const elapsed = DURATION - left;
      const apm = elapsed > 0 ? Math.round((answered / elapsed) * 60) : 0;
      const accuracy = answered > 0 ? Math.round((correct / answered) * 100) : 0;
      document.getElementById("statBenar").innerHTML = statChip("Benar", correct);
      document.getElementById("statSalah").innerHTML = statChip("Salah", wrong);
      document.getElementById("statAkurasi").innerHTML = statChip("Akurasi", accuracy + "%");
      document.getElementById("statApm").innerHTML = statChip("APM", apm);
      return { answered, accuracy, apm };
    }

    function submit(n) {
      if (left === 0 || done) return;
      const a = digits[cursor], b = digits[cursor + 1];
      const expected = (a + b) % 10;
      if (n === expected) { correct++; flash("ok"); } else { wrong++; flash("no"); }
      cursor++;
      digits.push(randInt(0, 9));
      renderDigits();
      updateStats();
    }
    function flash(kind) {
      highlightEl.className = "kr-highlight " + kind;
      setTimeout(() => { highlightEl.className = "kr-highlight"; }, 160);
    }
    function onKey(e) { if (/^[0-9]$/.test(e.key)) submit(Number(e.key)); }
    window.addEventListener("keydown", onKey);

    const timer = setInterval(() => {
      if (left > 0) left--;
      const mm = String(Math.floor(left / 60)).padStart(2, "0");
      const ss = String(left % 60).padStart(2, "0");
      document.getElementById("krTimer").textContent = `${mm}:${ss}`;
      document.getElementById("krProgress").innerHTML = progressLine((left / DURATION) * 100);
      if (left === 0 && !done) endNow();
    }, 1000);

    function endNow() {
      if (done) return;
      done = true;
      clearInterval(timer);
      window.removeEventListener("keydown", onKey);
      const { answered, accuracy, apm } = updateStats();
      finish({ moduleId: "kraepelin", score: correct, total: answered, stats: [
        { label: "Benar", value: String(correct) },
        { label: "Salah", value: String(wrong) },
        { label: "Akurasi", value: accuracy + "%" },
        { label: "APM", value: String(apm) }
      ] });
    }
    document.getElementById("krFinishNow").addEventListener("click", endNow);
  }

  /* ============================= Modul 3: Spasial ============================= */
  function drawShape(canvas, shape, size, accent) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr; canvas.height = size * dpr;
    canvas.style.width = size + "px"; canvas.style.height = size + "px";
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    const css = getComputedStyle(document.documentElement);
    const line = css.getPropertyValue("--kai-line").trim() || "#333";
    const signal = css.getPropertyValue("--kai-signal").trim() || "#e0a34a";
    const text = css.getPropertyValue("--kai-text").trim() || "#fff";
    ctx.strokeStyle = line; ctx.lineWidth = 1;
    const step = size / 6;
    for (let i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo(i * step, 0); ctx.lineTo(i * step, size);
      ctx.moveTo(0, i * step); ctx.lineTo(size, i * step); ctx.stroke();
    }
    const scale = size / 200;
    ctx.save();
    ctx.translate(size / 2, size / 2);
    ctx.scale(scale, scale);
    ctx.beginPath();
    shape.points.forEach(([x, y], i) => (i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)));
    ctx.closePath();
    ctx.fillStyle = accent ? signal + "33" : text + "14";
    ctx.fill();
    ctx.lineWidth = 3 / scale;
    ctx.strokeStyle = accent ? signal : text;
    ctx.stroke();
    const [fx, fy] = shape.points[0];
    ctx.beginPath(); ctx.arc(fx, fy, 6 / scale, 0, Math.PI * 2);
    ctx.fillStyle = accent ? signal : text; ctx.fill();
    ctx.restore();
  }

    }, 1000);

    function startQuiz() {
      clearInterval(timer);
      const quiz = generateMemoryQuiz(rows, 6);
      mountMcq("Modul 04 · Daya Ingat — Fase 2 Kuis", quiz, (correct, total) => {
        finish({ moduleId: "memory", score: correct, total, stats: [
          { label: "Benar", value: `${correct}/${total}` },
          { label: "Akurasi", value: `${total ? Math.round((correct / total) * 100) : 0}%` },
          { label: "Data dihafal", value: String(rows.length) }
        ] });
      });
    }
    document.getElementById("memStartQuiz").addEventListener("click", startQuiz);
  }

  /* ============================= Modul 5: Inventori Kepribadian ============================= */
  function mountPersonality() {
    const pairs = generateIpsativePairs(12);
    let i = 0;
    let tally = {};

    app.innerHTML = `
      <div class="stack">
        <div class="panel">
          ${panelLabel("Modul 05 · Inventori Kepribadian")}
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:12px;color:var(--kai-dim)">
            <span id="ipProgress"></span><span>Pilih yang paling menggambarkan diri Anda</span>
          </div>
          <div id="ipProgressBar"></div>
        </div>
        <div class="ip-grid" id="ipGrid"></div>
        <button class="kai-btn ghost" id="ipEnd">Akhiri modul</button>
      </div>`;

    function render() {
      const pair = pairs[i];
      document.getElementById("ipProgress").textContent = `Pasangan ${i + 1} / ${pairs.length}`;
      document.getElementById("ipProgressBar").innerHTML = progressLine((i / pairs.length) * 100);
      const grid = document.getElementById("ipGrid");
      grid.innerHTML = "";
      [pair.a, pair.b].forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "ip-card";
        btn.innerHTML = `<span class="tag">Pernyataan ${idx === 0 ? "A" : "B"}</span><p>${opt.text}</p>`;
        btn.addEventListener("click", () => choose(opt.dim));
        grid.appendChild(btn);
      });
    }
    function choose(dim) {
      tally[dim] = (tally[dim] || 0) + 1;
      if (i + 1 >= pairs.length) {
        const values = Object.values(tally);
        const max = Math.max(1, ...values);
        const radar = PERSONALITY_DIMENSIONS.map((d) => ({ dim: d, value: Math.round(((tally[d] || 0) / max) * 100) }));
        const top = radar.slice().sort((a, b) => b.value - a.value)[0];
        finish({ moduleId: "personality", score: pairs.length, total: pairs.length, stats: [
          { label: "Pasangan dijawab", value: String(pairs.length) },
          { label: "Dimensi dominan", value: top.dim }
        ], radar });
      } else { i++; render(); }
    }
    document.getElementById("ipEnd").addEventListener("click", () => {
      finish({ moduleId: "personality", score: i, total: pairs.length, stats: [{ label: "Pasangan dijawab", value: String(i) }] });
    });
    render();
  }

  /* ============================= Header: jam & tema ============================= */
  function tickClock() {
    const el = document.getElementById("liveClock");
    const now = new Date();
    el.textContent = now.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  tickClock();
  setInterval(tickClock, 1000);

  const html = document.documentElement;
  html.setAttribute("data-mode", "dark");
  document.getElementById("modeToggleBtn").addEventListener("click", () => {
    const next = html.getAttribute("data-mode") === "dark" ? "light" : "dark";
    html.setAttribute("data-mode", next);
    document.getElementById("modeToggleBtn").textContent = next === "dark" ? "Terang" : "Gelap";
  });

  renderHome();
})();
</script>
</body>
